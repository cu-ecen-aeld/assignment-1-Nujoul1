jobs:
  unit-test:
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Run unit test in amd64 container
        run: |
          docker pull cuaesd/aesd-autotest:24-unit-test
          docker run --rm --platform linux/amd64 \
            -v "${GITHUB_WORKSPACE}:/work" -w /work \
            cuaesd/aesd-autotest:24-unit-test \
            bash -lc "./unit-test.sh"

  full-test:
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Run full test in amd64 container
        run: |
          docker pull cuaesd/aesd-autotest:24-assignment1
          docker run --rm --platform linux/amd64 \
            -v "${GITHUB_WORKSPACE}:/work" -w /work \
            cuaesd/aesd-autotest:24-assignment1 \
            bash -lc "./full-test.sh"

